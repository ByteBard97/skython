; Skython settings for the per-connection cap live test only: the dev ini with small in-flight caps,
; so the test never puts hundreds of latent calls into the VM. Redeploy plugin/config/Skython.dev.ini afterwards.
[Python]
python_enabled = true
scripts_enabled = true
[Bridge]
bridge_enabled = true
port = 45977
fixed_token =
session_file =
max_inflight_per_connection = 16
[Calls]
default_timeout_ms = 5000
max_inflight_total = 64
enable_console = false
